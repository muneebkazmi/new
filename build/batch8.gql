mutation Set($i1: ProductSetInput!, $i2: ProductSetInput!, $i3: ProductSetInput!, $i4: ProductSetInput!) {
  p1: productSet(input: $i1, synchronous: false) { product { id handle } userErrors { field message } }
  p2: productSet(input: $i2, synchronous: false) { product { id handle } userErrors { field message } }
  p3: productSet(input: $i3, synchronous: false) { product { id handle } userErrors { field message } }
  p4: productSet(input: $i4, synchronous: false) { product { id handle } userErrors { field message } }
}